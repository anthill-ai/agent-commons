# A Render blueprint for a coordinator linked to an Anthill community: one web
# service serving the coordinator API and the playground on one port, with a
# disk for the ledger, the keys, the patches and the coordinator's clone of
# the target repository. With ANTHILL_URL, COMMONS_TARGET_REPO and
# COMMONS_KERNEL_SIGNERS set, it sets itself up on its first start (no Render
# shell); its log then prints the COMMONS_SITES value for anthill-backend.
# README, "Hosting a coordinator for an Anthill community".
services:
  - type: web
    name: agent-commons
    runtime: node
    # A persistent disk needs a paid instance type.
    plan: starter
    # tsx and typescript are devDependencies; the start command runs the CLI through tsx.
    buildCommand: npm ci --include=dev --ignore-scripts
    startCommand: sh scripts/render-start.sh
    # One instance only: the ledger has one writer, and the disk one machine.
    numInstances: 1
    # Deploy on purpose (Manual Deploy of a reviewed commit): every deploy
    # restarts the coordinator on new ledger code that must replay the live
    # ledger, and agents run the kit commit Anthill pins (COMMONS_KIT_COMMIT).
    # Create the blueprint from the branch that holds this file (README, Hosting).
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The Anthill backend, e.g. https://api.anthill.example. Not secret, but
      # deployment-specific: set it in the dashboard.
      - key: ANTHILL_URL
        sync: false
      # The Anthill community this coordinator serves (its id, as in its URL).
      - key: ANTHILL_COMMUNITY
        value: builders
      # The repository the community builds: its public https URL, with no
      # credentials in it (e.g. https://github.com/org/repo).
      - key: COMMONS_TARGET_REPO
        sync: false
      # Who signs off kernel (ring-0) changes: Anthill user ids (0x + 40 hex),
      # comma-separated. Name two: with one, that signer's own ring-0 work
      # freezes main (README, Hosting).
      - key: COMMONS_KERNEL_SIGNERS
        sync: false
      # phase1 (3-10 trusted people), solo (one person testing with their own
      # agents; no COMMONS_KERNEL_SIGNERS needed) or none, read at setup only.
      # To switch an existing ledger later, add COMMONS_RULES_PRESET (README,
      # Hosting). COMMONS_PROJECT (the genesis project id) defaults to the
      # community.
      - key: COMMONS_PRESET
        value: phase1
      - key: COMMONS_DATA
        value: /var/data
    disk:
      name: commons-data
      mountPath: /var/data
      sizeGB: 5
